<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anemos | Weather Insights</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-sky="clear-day">
    <div class="sky" aria-hidden="true">
      <img class="bi" id="backimg" alt="" />
      <div class="fx"></div>
    </div>

    <div class="wrap">
      <header>
        <img src="./Images/Logo.svg" alt="" width="40" height="40" />
        <h2>Anemos</h2>
      </header>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <input
          id="searchbar"
          type="text"
          placeholder="Search a city"
          aria-label="Search a city"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="searchbtn" type="submit" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-5.34c-.47-2.78-2.79-5-5.59-5.34a6.505 6.505 0 0 0-7.27 7.27c.34 2.8 2.56 5.12 5.34 5.59a6.5 6.5 0 0 0 5.34-1.48l.27.28v.79l4.25 4.25c.41.41 1.08.41 1.49 0c.41-.41.41-1.08 0-1.49zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14"
            />
          </svg>
        </button>
        <ul class="suggest" id="suggestions" role="listbox" hidden></ul>
      </form>

      <p id="status" class="status" role="status" hidden></p>

      <main class="grid" id="weatherPanel" hidden>
        <section class="panel hero">
          <div class="place">
            <h2 id="cityElement" class="city"></h2>
            <p id="countryElement" class="country"></p>
            <p id="timeElement" class="muted"></p>
          </div>
          <div class="now">
            <h1 id="tempElement" class="temp"></h1>
            <div class="cond">
              <div id="weathericon" class="hero-ico"></div>
              <p id="descElement"></p>
              <p id="feelsElement" class="muted"></p>
              <p id="hiloElement" class="muted"></p>
            </div>
          </div>
        </section>

        <section class="panel"><div class="tiles" id="tiles"></div></section>

        <section class="panel wide">
          <h3>Next 24 hours</h3>
          <ul class="hourly" id="hourly"></ul>
        </section>

        <section class="panel wide">
          <h3>5-day forecast</h3>
          <ul class="daily" id="daily"></ul>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
